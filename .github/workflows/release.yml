name: Release (Windows)

# Every push to main whose pyproject version has no release yet builds Mekasa for Windows and
# publishes GitHub release v<version> with the installer and the portable zip. A v* tag or a
# manual run does the same for that ref. Bump `version` in pyproject.toml for a new release.

on:
  push:
    branches: [main, "release/**"] # release/** only builds (artifact to test), never publishes
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version and decide
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match pyproject version $version"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # Only main or a version tag publishes; a manual run on another branch only builds.
          $releasable = $env:GITHUB_REF -eq "refs/heads/main" -or $env:GITHUB_REF_TYPE -eq "tag"
          $publish = $releasable -and -not $exists
          "publish=$(if ($publish) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          if (-not $publish) { Write-Host "Build only, nothing published (exists=$exists, ref=$env:GITHUB_REF)." }

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Test
        run: uv sync --locked && uv run pytest -q

      - name: Build installer and portable zip
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mekasa-${{ steps.meta.outputs.version }}-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $notes = @"
          Mekasa $env:VERSION para Windows 10/11 (64 bits). Funciona sin internet.

          **Instalar:** descargue ``Mekasa-$env:VERSION-setup.exe`` y ejecútelo (no pide administrador).
          Queda en el menú Inicio como *Mekasa (tablero)*.

          **Sin instalar:** descargue ``Mekasa-$env:VERSION-windows-x64-portable.zip``, descomprímalo y abra ``Mekasa.exe``.

          Calibraciones, reportes, registros y el vocabulario editable se guardan en ``%LOCALAPPDATA%\Mekasa``
          (con un tope de espacio configurable en ``config\communication.toml``, sección ``[storage]``).
          Desinstalar no los borra.

          Prototipo de investigación: no es un dispositivo médico.
          "@
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip", ".txt" } |
            ForEach-Object { $_.FullName }
          gh release create $env:TAG @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Mekasa $env:VERSION" --notes $notes
