# Mekasa communication board. Engineering hypotheses only, not clinical thresholds.
# Compare alternatives with guided tests before fixing values for a person.

[communication]
# 900 ms is the initial reversible hypothesis; 450 ms and 1200 ms are the comparison
# profiles (Majaranta et al. studied 450/900 ms in eye typing, a different task).
dwell_seconds = 0.9
cooldown_seconds = 1.0
# Normalized expansion of the focused card while dwelling. Cards are separated by a gap
# larger than twice this margin, so focus can never jump to a neighbour through jitter.
hysteresis_margin = 0.03
# Stable valid signal required after any loss, pause, mode change or start-up.
recovery_seconds = 0.5
# Frames older than this never drive selection.
max_frame_age_seconds = 0.25
# Eye-only dropouts (blink, a frame with the lid too low) up to this long freeze dwell
# progress instead of cancelling it. Nothing advances or is emitted during the gap.
# Camera, stale-frame, tracking and placement losses still cancel immediately.
# 2026-11-16: ~15% scattered eye dropouts made the bottom row unreachable without it.
eye_dropout_grace_seconds = 0.2
# Optional second dwell on the same option (leave, return, dwell) before speaking.
confirmation_required = false
confirmation_window_seconds = 4.0
# BOTH, LEFT or RIGHT (anatomical side of the person).
eye_mode = "BOTH"
high_contrast = true
# Camera view for demonstrations and filming: "off", "corner" (inside the top bands, never over
# an option) or "center" (larger, over the gap between the cards). Key V cycles it while running.
# The image is only displayed, never stored.
camera_view = "off"

# --- Precision (2026-11-16 analysis, measured in Mekasa) ---------------------------------
# A calibration from one sitting does not transfer to another: 2x2 frame accuracy fell from
# 96-100 % within a session to 26 % across sessions; a fresh 2-round calibration with a
# head-movement segment reached 95-98 % (cross-validated within the session). So the board
# calibrates at every start (~35 s). Set false to reuse the last calibration + 4-point
# alignment (faster, less precise).
calibrate_at_start = true
# Before calibrating: a brief spoken explanation of how to use the board, then a countdown.
# ENTER or SPACE skips it.
intro = true
countdown_seconds = 3
# Re-run the 4-point alignment automatically when the face stays clearly closer, farther,
# shifted or turned relative to calibration (engineering hypothesis).
auto_realign = true
# Keep adjusting while the board is used (2026-11-17). Each selection made by looking or by
# blinking-then-looking is evidence of where that option is for the current posture. It counts
# only after 4 s without being undone (C, VOLVER or BORRAR right after choosing). Per-axis and
# bounded; evidence from a different posture fades. Engineering hypothesis.
implicit_recalibration = true
# Also re-fit the model weights with the frames looked at while choosing (confirmed only).
adapt_model_weights = true
# Scale predictions about the camera by calibration face width / current face width, the
# projective effect of viewing distance. Engineering hypothesis until measured.
distance_compensation = true
# Accepted face width as a fraction of the image (closer = wider). The research protocol uses
# 0.25-0.45; the board accepts more range. Beyond these limits the board asks to move.
min_face_width = 0.16
max_face_width = 0.62
# Camera position in screen-normalized coordinates (x, y). Default: top-centre bezel.
camera_position = [0.5, -0.02]

# --- Conversation board --------------------------------------------------------------------
# "conversation": menus to compose full messages (needs, how I feel, urgent, questions,
# people, free time) from config/vocabulario.txt, editable by family and clinicians.
# "simple": the original SÍ / NO / AGUA / AYUDA board.
interface = "conversation"
vocabulary = "config/vocabulario.txt"
# Grammatical gender for phrases like "Estoy cansado/cansada": "m" or "f".
gender = "m"
# Beep pattern (local speaker) together with the spoken urgent message.
urgent_alarm = true

# --- How an option is chosen ----------------------------------------------------------------
# "dwell":    look at an option for dwell_seconds.
# "blink":    look until it is ready (blink_min_focus_seconds), then blink blink_select_count
#             times. Nothing is ever chosen by time alone. Starts on standby.
# "combined": either: look for combined_dwell_seconds, or look and blink. Requested for a
#             person who can blink and fix the gaze but moves little.
selection_mode = "combined"
combined_dwell_seconds = 3.0
# Blink gestures (blinks in a row), in every mode. Distinct numbers between 2 and 9.
blink_select_count = 3   # choose the option being looked at
blink_toggle_count = 4   # start/stop reading (SPACE does the same)
blink_speak_count = 5    # say the composed message now
blink_urgent_count = 7   # 7 OR MORE: urgent call + alarm at once, any screen, even paused
urgent_repeat_seconds = 2.5  # if the blinking continues, repeat the call (at most this often)
blink_toggle = true
# Winks (one eye only). The calibration asks to close only the right eye 3 times, then only
# the left; winks of an eye are enabled only if they were recognized there. Spontaneous blinks
# are bilateral, so winks are hard to trigger by accident.
calibrate_winks = true
wink_select_count = 3     # winks in a row with one eye
# Order of a blink/wink selection (2026-11-17 feedback: the gaze estimate jumps while blinking,
# so looking first and blinking after was hard). "blink_then_look": blink (or wink) first, then
# look at the option for intent_focus_seconds within intent_window_seconds.
# "look_then_blink": look until the option is ready, then blink.
blink_select_order = "blink_then_look"
intent_focus_seconds = 1.0
intent_window_seconds = 5.0
# The gaze estimate jumps right after the eyes reopen: keep the previous point this long.
blink_settle_seconds = 0.3
# Engineering hypotheses, to adjust with the person:
blink_min_focus_seconds = 0.4         # stable gaze on the option before the blinks
blink_selection_window_seconds = 3.0  # the blinks must end within this time after looking
blink_min_closed_seconds = 0.08       # shorter closures are noise
blink_max_closed_seconds = 0.8        # longer closures are resting the eyes (and cancel)
blink_max_gap_seconds = 0.8           # max open time between blinks of one sequence

[speech]
enabled = true
# If no local voice exists, the board still works and the confirmed message stays on screen.
required = false
language = "es-ES"
rate = 0
volume = 100

[phrases.YES]
label = "SÍ"
phrase = "Sí"

[phrases.NO]
label = "NO"
phrase = "No"

[phrases.WATER]
label = "AGUA"
phrase = "Quiero agua"

[phrases.HELP]
label = "AYUDA"
phrase = "Necesito ayuda"

[storage]
# Disk reserved for work/ (session reports, calibration history, adapted models, program logs).
# When exceeded, the oldest files in history/ and logs/ folders are deleted first; the current
# models and the latest report are always kept. Checked at start and at exit.
max_work_mb = 512
# Warn (the board still runs) when the disk has less free space than this.
min_free_disk_mb = 200
