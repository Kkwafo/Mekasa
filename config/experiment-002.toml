[calibration]
# Engineering baseline only. This is not a clinically validated model or threshold.
ridge_alpha = 10.0
validation_block_index = 3
min_train_samples_per_target = 40
min_validation_samples_per_target = 20
min_head_movement_train_samples = 40
min_head_movement_validation_samples = 20
head_movement_training_weight = 8
# Explicit recalibration acceptance band. This permits honest reanalysis of a
# preserved report without rewriting its original protocol configuration.
min_accepted_face_width = 0.25
max_accepted_face_width = 0.45
require_audio_prompts = true
# 2026-11-16: eye aperture (EAR) added because eyelids follow vertical gaze; on that
# session's held-out block it raised 2x2 frame accuracy for single-eye modes (RIGHT 68->97%,
# LEFT 51->76%) and 9-target hit rate for BOTH (40->48%). Selected on the same block:
# confirm prospectively. *_iris_v (canthus-anchored vertical offset) is an untested
# hypothesis; reports recorded before it existed need config/experiment-002-legacy.toml.
feature_names = [
  "left_iris_x",
  "left_iris_y",
  "left_iris_v",
  "right_iris_x",
  "right_iris_y",
  "right_iris_v",
  "left_eye_aspect_ratio",
  "right_eye_aspect_ratio",
  "head_yaw_degrees",
  "head_pitch_degrees",
  "head_roll_degrees",
]

[live_evaluation]
smoothing_alpha = 0.25
