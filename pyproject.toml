[project]
name = "mekasa-gaze-engine"
version = "0.0.1"
description = "Local-first experimental eye-gaze feature engine for Mekasa"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
  "mediapipe>=1.0.1,<2",
  "numpy>=2.5,<3",
  # MediaPipe depends on the contrib distribution. Do not install both OpenCV
  # wheel families because they expose the same top-level cv2 package.
  "opencv-contrib-python>=5.0,<6",
  "psutil>=7.2,<8",
]

[project.scripts]
mekasa-experiment-001 = "mekasa_gaze.experiment001:main"
mekasa-guided-validation = "mekasa_gaze.guided_experiment:main"
mekasa-calibrate = "mekasa_gaze.calibration:main"
mekasa-live-evaluation = "mekasa_gaze.live_evaluation:main"
mekasa-region-evaluation = "mekasa_gaze.region_evaluation:main"
mekasa-controlled-region-validation = "mekasa_gaze.controlled_region_validation:main"
mekasa-probe-cameras = "mekasa_gaze.probe:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engines/gaze_engine/src/mekasa_gaze"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["engines/gaze_engine/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["engines/gaze_engine/src", "engines/gaze_engine/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mekasa_gaze"]
mypy_path = "engines/gaze_engine/src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cv2", "mediapipe", "psutil"]
ignore_missing_imports = true
